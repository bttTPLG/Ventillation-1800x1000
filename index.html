<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habillage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      /* Wrapper global centré */
      .wrapper {
        width: 100%;
        max-width: 1800px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        box-sizing: border-box;
        position: relative;
        font-family: "Kanit", sans-serif;
      }

      .background-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
      }

      .TPLG-mid {
        position: relative;
        flex: 0 0 1086px;
        display: flex;
        flex-direction: row;
        align-items: center;
        height: 220px;
        z-index: 2;
      }

      .TPLG-mid .offre {
        width: 627px;
        height: fit-content;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: visible;
      }

      .TPLG-mid .offre .sticker {
        position: absolute;
        top: -50px;
        left: 450px;
        height: 150px;
        animation-duration: 1.3s;
        animation-name: clignoter;
        animation-iteration-count: infinite;
        transition: none;
      }

      @keyframes clignoter {
        0% {
          opacity: 1;
        }
        40% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .TPLG-mid .offre .txt1 {
        font-size: 42px;
        font-weight: bold;
        color: #f2ff00;
        line-height: 80%;
        margin: 0;
      }

      .TPLG-mid .offre .txt2 {
        font-size: 36px;
        color: white;
        font-weight: 700;
        margin: 0;
        width: 100%;
        text-align: right;
        padding-right: 50px;
        box-sizing: border-box;
      }
      .TPLG-left,
      .TPLG-right {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        flex: 0 0 357px;
        box-sizing: border-box;
      }

      .TPLG-left {
        align-items: flex-end;
      }

      .TPLG-right {
        align-items: flex-start;
      }

      /*-------- Conteneur text ---------*/
      .TPLG-text-container {
        margin-top: 220px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 142px;
        height: 548px;
        background-color: transparent;
      }

      .TPLG-right .TPLG-text-container {
        gap: 60px;
      }

      .TPLG-right .TPLG-text-container .slogan {
        width: 100%;
        height: fit-content;
        padding: 10px 5px;
        gap: 30px;
        box-sizing: border-box;
        background-color: #e20613;
        display: flex;
        flex-direction: column;
        box-shadow: -12px 5px 0px 0px #fffb06;
      }

      .TPLG-right .TPLG-text-container .slogan .txt1 {
        color: #f2ff00;
        font-size: 55px;
        font-weight: bold;
        margin: 0;
        line-height: 80%;
        text-align: center;
      }

      .TPLG-right .TPLG-text-container .slogan .txt2 {
        color: #f2ff00;
        font-size: 43px;
        font-weight: bold;
        margin: 0;
        text-align: center;
      }

      .TPLG-right .TPLG-text-container .slogan .txt3 {
        color: white;
        font-size: 40px;
        font-weight: bold;
        margin: 0;
        line-height: 60%;
        text-align: center;
      }

      .TPLG-right .TPLG-text-container .slogan .txt4 {
        color: white;
        font-size: 20px;
        font-weight: bold;
        margin: 0;
        text-align: center;
      }

      .TPLG-right .TPLG-text-container .devis {
        width: 100%;
        height: fit-content;
        padding: 10px 5px;
        gap: 30px;
        box-sizing: border-box;
        background-color: #e20613;
        box-shadow: -12px 6px 0px 0px #f2ff00;
        display: flex;
        flex-direction: column;
        position: relative;
        animation-duration: 1.3s;
        animation-name: clignoter;
        animation-iteration-count: infinite;
        transition: none;
      }

      .TPLG-right .TPLG-text-container .devis .txt1 {
        font-size: 26px;
        font-weight: 500;
        color: white;
        line-height: 80%;
        margin: 0;
      }

      .TPLG-right .TPLG-text-container .devis .txt2 {
        font-size: 25px;
      }

      .TPLG-left .TPLG-text-container .produit {
        width: 100%;
        height: fit-content;
        padding: 10px 5px;
        gap: 30px;
        box-sizing: border-box;
        background-color: #e20613;
        display: flex;
        flex-direction: column;
        box-shadow: 12px 5px 0px 0px #fffb06;
      }

      .TPLG-left .TPLG-text-container .produit .txt1 {
        width: 100%;
        font-size: 28px;
        font-weight: bold;
        text-align: end;
        color: white;
        margin: 0;
        line-height: 92%;
      }

      .TPLG-left .TPLG-text-container .produit .txt2 {
        font-size: 32px;
      }

      .TPLG-left .TPLG-text-container .produit .txt3 {
        font-size: 20px;
        line-height: 113%;
      }

      .TPLG-left .TPLG-text-container .produit .txt4 {
        width: 100%;
        font-size: 24px;
        font-weight: bold;
        text-align: end;
        color: #f2ff00;
        margin: 0;
      }

      .TPLG-left .TPLG-text-container .produit .txt5 {
        font-size: 40px;
        line-height: 80%;
      }

      .TPLG-left .TPLG-text-container .produit .txt6 {
        font-size: 10px;
        color: white;
        line-height: 0%;
        font-weight: 500;
      }
      /* ---------------------- MID ---------------------- */
      /* ------------------- LOGO TPLG ------------------- */

      .TPLG-logo-container {
        width: 40%;
        height: 80%;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        padding: 20px;
      }

      .TPLG-logo-container {
        position: relative;
        z-index: 1;
      }

      .TPLG-LOGO {
        width: 80%;
      }

      .TPLG-global-link {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <a
        href="https://www.toutpourlegrain.fr/fr/contact"
        target="_blank"
        class="TPLG-global-link"
      ></a>
      <img
        src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/Habillage-ventillation-fond2.png"
        class="background-image"
      />
      <!-- Gauche -->
      <section class="TPLG-left">
        <div class="TPLG-text-container">
          <div class="produit">
            <p class="txt1">
              Caniveau <br />
              <span class="txt2">+ grille</span><br /><span class="txt3"
                >renforcée</span
              >
            </p>
            <p class="txt4">
              A partir de <br />
              <span class="txt5">37€/m</span><br /><span class="txt6"
                >suivant stock disponible</span
              >
            </p>
          </div>
        </div>
      </section>

      <!-- Milieu -->
      <section class="TPLG-mid">
        <!-- Logo -->
        <div class="TPLG-logo-container">
          <img
            src="https://raw.githubusercontent.com/bttTPLG/img/eb099beebfb05c3c7642433b39c5e27d81cc5bd9/asset/Logo-TPLG-blanc-2.svg"
            alt="Logo Tout Pour Le Grain"
            class="TPLG-LOGO"
          />
        </div>
        <div class="offre">
          <img
            src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/sticker.png"
            class="sticker"
          />
          <p class="txt1">OFFRE <br />EXCEPTIONNELLE !</p>
          <p class="txt2">Caniveau de ventilation</p>
        </div>
      </section>

      <!-- Droite -->
      <section class="TPLG-right">
        <div class="TPLG-text-container">
          <div class="slogan">
            <p class="txt1">
              PRIX<br />
              <span class="txt2">INEDIT</span>
            </p>
            <p class="txt3">
              ÉTUDE<br />
              <span class="txt4">SUR-MESURE</span>
            </p>
          </div>
          <div class="devis">
            <p class="txt1">
              Demandez <br /><span class="txt2">votre devis</span>
            </p>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
